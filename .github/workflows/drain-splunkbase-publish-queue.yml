name: Drain Splunkbase publish queue

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      diagnose_issue_number:
        description: "Read-only app/release diagnostics for a queue issue; skips publishing"
        type: string
        required: false
        default: ""

concurrency:
  group: splunkbase-publisher-soar-connectors-default
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  drain:
    if: vars.SPLUNKBASE_PUBLISH_QUEUE_ENABLED == 'true'
    timeout-minutes: 60
    runs-on: >-
      ${{ inputs.diagnose_issue_number && fromJSON('["ubuntu-latest"]') ||
      fromJSON(format('["codebuild-integration-tests-{0}-{1}","image:custom-linux-875003031410.dkr.ecr.us-west-2.amazonaws.com/soar-connectors/pytest:f7150dbb7f347d35f8f4bb285d36985ecd4cf231"]', github.run_id, github.run_attempt)) }}
    steps:
      - name: Check out queue implementation
        uses: actions/checkout@v4

      - name: Install worker dependencies
        env:
          DIAGNOSE_ISSUE_NUMBER: ${{ inputs.diagnose_issue_number }}
        run: |
          python -m pip install "uv==0.12.0"
          if [ -n "$DIAGNOSE_ISSUE_NUMBER" ]; then
            exit 0
          fi
          if command -v yum >/dev/null 2>&1; then
            yum install -y cairo
          else
            apt-get update
            apt-get install -y libcairo2
          fi

      - name: Drain queued connector publications
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUEUE_REPOSITORY: ${{ github.repository }}
          SPLUNKBASE_USER: ${{ secrets.SPLUNKBASE_USER }}
          SPLUNKBASE_PASSWORD: ${{ secrets.SPLUNKBASE_PASSWORD }}
          SPLUNKBASE_DRAFT_FLOW_ENABLED: ${{ vars.SPLUNKBASE_DRAFT_FLOW_ENABLED }}
          SLACK_INTERNAL_TOKEN: ${{ secrets.SLACK_INTERNAL_TOKEN }}
          SLACK_COMMUNITY_TOKEN: ${{ secrets.SLACK_COMMUNITY_TOKEN }}
          SLACK_INTERNAL_CHANNEL: ${{ vars.SLACK_INTERNAL_CHANNEL_ID }}
          SLACK_COMMUNITY_CHANNEL: ${{ vars.SLACK_COMMUNITY_CHANNEL_ID }}
          SEND_RELEASE_MESSAGE: ${{ vars.SEND_RELEASE_MESSAGE }}
          DIAGNOSE_ISSUE_NUMBER: ${{ inputs.diagnose_issue_number }}
        run: |
          if [ -n "$DIAGNOSE_ISSUE_NUMBER" ]; then
            uv run .github/scripts/drain_splunkbase_publish_queue.py diagnose --issue-number "$DIAGNOSE_ISSUE_NUMBER"
          else
            uv run .github/scripts/drain_splunkbase_publish_queue_worker.py
          fi
