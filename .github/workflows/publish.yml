name: Reusable Publish Workflow

on:
  workflow_call:
    secrets:
      # Accepted for existing callers; publishing credentials and notifications are centralized.
      splunkbase_user:
        required: false
      splunkbase_password:
        required: false
      semantic_release_pk:
        required: true
      slack_internal_token:
        required: false
      slack_community_token:
        required: false

jobs:
  semantic-version:
      runs-on: ubuntu-latest
      outputs:
        release_version: ${{ steps.release.outputs.release_version }}
        release_commit: ${{ steps.release.outputs.release_commit }}
      permissions:
        contents: write
        pull-requests: write
      steps:
        - uses: actions/create-github-app-token@v1
          id: app-token
          with:
            app-id: ${{ vars.SEMANTIC_RELEASE_APP_ID }}
            private-key: ${{ secrets.semantic_release_pk }}

        - name: Check out app repo
          uses: actions/checkout@v4
          with:
              fetch-depth: 0
              token: ${{ steps.app-token.outputs.token }}

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.13'

        - name: Install uv for SDKfied release
          if: hashFiles('**/uv.lock') != ''
          run: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

        - name: Cache pip
          uses: actions/cache@v4
          with:
            path: ~/.cache/pip
            key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

        - name: Set up .github repo
          uses: actions/checkout@v4
          with:
            repository: splunk-soar-connectors/.github
            path: dotgithub

        - name: Copy necessary files to app repo for semantic release
          run: |
            cp dotgithub/.releaserc.json $(pwd)/.releaserc.json
            cp dotgithub/.github/utils/update_version.py $(pwd)/update_version.py

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: "lts/*"

        - name: Install dependencies
          run: |
            npm install --save-dev semantic-release
            npm install @semantic-release/changelog @semantic-release/git @semantic-release/exec conventional-changelog-conventionalcommits@9.3.1 -D
            pip install tomlkit

        - name: Run semantic-release and update version numbers
          id: release
          env:
            GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          run: |
            rm -f release_version.txt
            npx semantic-release -e $(pwd)/.releaserc.json --tag-format "\${version}"
            if [[ -s release_version.txt ]]; then
              echo "release_version=$(<release_version.txt)" >> "$GITHUB_OUTPUT"
              echo "release_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            fi

          # Semantic-release will "pass" even if we don't increase the version
          # We need to clear unreleased release notes in this case
        - name: Clear unreleased notes
          run: |
              echo "**Unreleased**" > $(pwd)/release_notes/unreleased.md

        - name: Clean up
          run: |
              rm -rf dotgithub
              rm -f update_version.py

  detect-app-type:
    runs-on: ubuntu-latest
    outputs:
      is_sdkfied: ${{ steps.detect.outputs.is_sdkfied }}
      uv_lock_directory: ${{ steps.detect.outputs.uv_lock_directory }}
    steps:
      - name: Check out app repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Detect App Type
        id: detect
        run: |
          echo "Detecting app type..."

          # Find uv.lock file and get its parent directory
          UV_LOCK_PATH=$(find . -name "uv.lock" -type f | head -1)

          if [ -n "$UV_LOCK_PATH" ]; then
            UV_LOCK_DIR=$(dirname "$UV_LOCK_PATH")
            echo "Found uv.lock in directory: $UV_LOCK_DIR"
            echo "This is an SDKfied app"
            echo "is_sdkfied=true" >> $GITHUB_OUTPUT
            echo "uv_lock_directory=$UV_LOCK_DIR" >> $GITHUB_OUTPUT
          else
            echo "No uv.lock found"
            echo "This is a traditional app"
            echo "is_sdkfied=false" >> $GITHUB_OUTPUT
            echo "uv_lock_directory=" >> $GITHUB_OUTPUT
          fi

          echo "App detection completed"
        shell: bash

  build:
    # connector-template intentionally uses a sentinel app ID and is not a publishable app.
    if: github.event.repository.name != 'connector-template'
    runs-on: ubuntu-latest
    needs: [semantic-version, detect-app-type]
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
    env:
      IS_SDKFIED: ${{ needs.detect-app-type.outputs.is_sdkfied }}
      UV_LOCK_DIRECTORY: ${{ needs.detect-app-type.outputs.uv_lock_directory }}
    steps:
      - name: Check out app repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Keep the package source aligned with the versioned release.
          ref: ${{ needs.semantic-version.outputs.release_commit || 'main' }}

      - name: Record immutable build source
        id: source
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip
        if: env.IS_SDKFIED == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Build Application
        if: env.IS_SDKFIED == 'false'
        uses: splunk-soar-connectors/.github/.github/actions/build-app@main

      - name: Setup SDKfied App Environment
        if: env.IS_SDKFIED == 'true'
        uses: splunk-soar-connectors/.github/.github/actions/sdkfied-app-setup@main
        with:
          uv_lock_directory: ${{ env.UV_LOCK_DIRECTORY }}

      - name: Build SDK app
        if: env.IS_SDKFIED == 'true'
        run: |

          cd "${{ env.UV_LOCK_DIRECTORY }}"
          echo "Building SDKfied app using soarapps CLI"
          uv run soarapps package build . --output-file /tmp/${{ github.event.repository.name }}.tgz
          echo "SDKfied app build completed successfully"

      - name: Upload app tar file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-tar
          path: /tmp/${{ github.event.repository.name }}.tgz

  publish-release-assets:
    if: needs.semantic-version.outputs.release_version != ''
    needs: [semantic-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: connector-release-${{ github.repository }}-${{ needs.semantic-version.outputs.release_version }}
      cancel-in-progress: false
    steps:
      - name: Create release token
        uses: actions/create-github-app-token@v1
        id: release-token
        with:
          app-id: ${{ vars.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.semantic_release_pk }}

      - name: Download built connector
        uses: actions/download-artifact@v4
        with:
          name: app-tar
          path: artifacts

      - name: Publish connector release assets
        uses: splunk-soar-connectors/.github/.github/actions/publish-release-assets@main
        with:
          repository: ${{ github.repository }}
          release_tag: ${{ needs.semantic-version.outputs.release_version }}
          artifact_path: ${{ github.workspace }}/artifacts/${{ github.event.repository.name }}.tgz
          github_token: ${{ steps.release-token.outputs.token }}

  distribute-playground:
    needs: [semantic-version, publish-release-assets]
    runs-on:
      - codebuild-integration-tests-${{ github.run_id }}-${{ github.run_attempt }}
      - image:custom-linux-875003031410.dkr.ecr.us-west-2.amazonaws.com/soar-connectors/pytest:6abbbe275a28d5b8bf18d3384a19aa68e9c242d0
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Trigger connector distribution
        uses: splunk-soar-connectors/.github/.github/actions/trigger-connector-distribution@main
        with:
          repository: ${{ github.repository }}
          release_tag: ${{ needs.semantic-version.outputs.release_version }}
          environment: playground

  distribute-staging:
    needs: [semantic-version, distribute-playground]
    runs-on:
      - codebuild-integration-tests-${{ github.run_id }}-${{ github.run_attempt }}
      - image:custom-linux-875003031410.dkr.ecr.us-west-2.amazonaws.com/soar-connectors/pytest:6abbbe275a28d5b8bf18d3384a19aa68e9c242d0
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Trigger connector distribution
        uses: splunk-soar-connectors/.github/.github/actions/trigger-connector-distribution@main
        with:
          repository: ${{ github.repository }}
          release_tag: ${{ needs.semantic-version.outputs.release_version }}
          environment: staging

  enqueue-publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Create central queue token
        uses: actions/create-github-app-token@v1
        id: queue-token
        with:
          app-id: ${{ vars.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.semantic_release_pk }}
          owner: splunk-soar-connectors
          repositories: |
            .github

      - name: Download app tar file for queue storage
        uses: actions/download-artifact@v4
        with:
          name: app-tar
          path: ${{ github.workspace }}/artifacts

      - name: Enqueue serialized Splunkbase publication
        uses: splunk-soar-connectors/.github/.github/actions/enqueue-publish@main
        with:
          artifact_path: ${{ github.workspace }}/artifacts/${{ github.event.repository.name }}.tgz
          commit_sha: ${{ needs.build.outputs.commit_sha }}
          github_token: ${{ steps.queue-token.outputs.token }}
